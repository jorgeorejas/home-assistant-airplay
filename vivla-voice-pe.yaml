# vivla-voice-pe.yaml — minimal Voice PE firmware that talks to the
# vivla.ai voice gateway (apps/mastra/voice-bridge in vivla-intelligence)
# instead of Home Assistant's Assist pipeline.
#
# This is intentionally narrow: WiFi, mic, speaker, wake word, vivla_voice,
# and a couple of debug log handlers. None of the LED/jack/mute/touch UX
# from the original home-assistant-voice.yaml is wired here. Once the
# core path (wake → bridge → reply audio) works, integrate this block
# into a fuller config by copying docs/home-assistant-voice-pe-dev/home-assistant-voice.yaml,
# deleting its api: and voice_assistant: blocks, and pasting vivla_voice:
# in their place (see README-vivla.md).
#
# Required secrets in secrets.yaml:
#   wifi_ssid, wifi_password
#   vivla_bridge_url   — e.g. wss://api.vivla.ai/voice
#   vivla_device_token — bearer token your bridge expects (DEVICE_TOKEN)

substitutions:
  device_name: vivla-voice-pe

esphome:
  name: ${device_name}
  friendly_name: Vivla Voice PE
  name_add_mac_suffix: true
  min_version: 2026.3.0
  on_boot:
    priority: 375
    then:
      - logger.log: "vivla-voice-pe boot"
      - delay: 1s
      - switch.turn_on: internal_speaker_amp

esp32:
  board: esp32-s3-devkitc-1
  cpu_frequency: 240MHz
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG
  logs:
    sensor: WARN

# No api: block — the device does not register with Home Assistant.
# Provisioning over USB / improv_serial only for v0.
ota:
  - platform: esphome
    id: ota_esphome

improv_serial:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

network:
  enable_ipv6: true

i2c:
  - id: internal_i2c
    sda: GPIO5
    scl: GPIO6
    frequency: 400kHz

# ---- Hardware: same I2S + DAC + AIC3204 wiring as the stock VPE ----

i2s_audio:
  - id: i2s_output
    i2s_lrclk_pin:
      number: GPIO7
    i2s_bclk_pin:
      number: GPIO8
  - id: i2s_input
    i2s_lrclk_pin:
      number: GPIO14
    i2s_bclk_pin:
      number: GPIO13

audio_dac:
  - platform: aic3204
    id: aic3204_dac
    i2c_id: internal_i2c

microphone:
  - platform: i2s_audio
    id: i2s_mics
    i2s_din_pin: GPIO15
    adc_type: external
    pdm: false
    sample_rate: 16000
    bits_per_sample: 32bit
    i2s_mode: secondary
    i2s_audio_id: i2s_input
    channel: stereo

speaker:
  - platform: i2s_audio
    id: i2s_audio_speaker
    sample_rate: 48000
    i2s_mode: secondary
    i2s_dout_pin: GPIO10
    bits_per_sample: 32bit
    i2s_audio_id: i2s_output
    dac_type: external
    channel: stereo
    timeout: never
    buffer_duration: 100ms
    audio_dac: aic3204_dac

  # Resamples Gemini's 24 kHz mono PCM up to 48 kHz for the I2S DAC.
  - platform: resampler
    id: tts_resampling_speaker
    output_speaker: i2s_audio_speaker
    sample_rate: 48000
    bits_per_sample: 16

switch:
  # The AIC3204 amp needs to be enabled before sound plays.
  - platform: gpio
    id: internal_speaker_amp
    pin: GPIO46
    restore_mode: ALWAYS_ON

micro_wake_word:
  id: mww
  microphone:
    microphone: i2s_mics
    channels: 1
    gain_factor: 4
  stop_after_detection: false
  models:
    - model: https://github.com/kahrendt/microWakeWord/releases/download/okay_nabu_20241226.3/okay_nabu.json
      id: okay_nabu
  vad:
  on_wake_word_detected:
    - logger.log:
        format: "wake: %s"
        args: ["wake_word.c_str()"]
    - if:
        condition:
          vivla_voice.is_running:
        then:
          - vivla_voice.stop:
        else:
          - vivla_voice.start:

# ---- The actual vivla_voice integration ----

external_components:
  - source:
      type: local
      path: esphome/components
    components: [vivla_voice]

vivla_voice:
  id: va
  url: !secret vivla_bridge_url
  token: !secret vivla_device_token
  reconnect_interval: 5s
  microphone:
    microphone: i2s_mics
    channels: [0]
    bits_per_sample: 16
  speaker: tts_resampling_speaker
  micro_wake_word: mww

  on_client_connected:
    - logger.log: "vivla session ready"
  on_client_disconnected:
    - logger.log: "vivla session closed"
  on_start:
    - logger.log: "vivla turn started"
  on_listening:
    - logger.log: "listening"
  on_stt_vad_start:
    - logger.log: "vad start"
  on_stt_vad_end:
    - logger.log: "vad end → thinking"
  on_tts_start:
    - logger.log: "tts start → replying"
  on_end:
    - logger.log: "vivla turn complete"
  on_transcript:
    - logger.log:
        format: "[%s] %s"
        args: ["role.c_str()", "text.c_str()"]
  on_intent_progress:
    - logger.log:
        format: "intent: %s"
        args: ["x.c_str()"]
  on_error:
    - logger.log:
        format: "ERROR: %s"
        args: ["code.c_str()"]
