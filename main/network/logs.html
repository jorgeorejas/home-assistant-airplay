<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logs · Altavoces Salón</title>
<style>
:root{--bg:#0a0a0c;--card:#16161a;--line:#26262e;--txt:#f2f2f5;--dim:#9b9ba3;--accent:#0a84ff;--info:#9b9ba3;--warn:#ff9f0a;--err:#ff453a;--ok:#30d158;--dbg:#5e5ce6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font:13px -apple-system,system-ui,"SF Pro Display","Segoe UI",sans-serif;height:100%}
body{display:flex;flex-direction:column;height:100vh}
header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px}
h1{font-size:17px;font-weight:600}
.spacer{flex:1}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--err);margin-right:6px;vertical-align:middle;transition:background .2s}
.dot.on{background:var(--ok)}
.status{color:var(--dim);font-size:12px}
button{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:7px;padding:6px 12px;font:inherit;cursor:pointer}
button:hover{background:#1f1f25}
a{color:var(--accent);text-decoration:none}
#log{flex:1;overflow-y:auto;padding:14px 20px;font:12px/1.45 ui-monospace,SF Mono,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
#log .l-i{color:var(--info)}
#log .l-w{color:var(--warn)}
#log .l-e{color:var(--err)}
#log .l-d{color:var(--dbg)}
#log .l-v{color:#666}
.bar{padding:8px 20px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;font-size:12px;color:var(--dim)}
.bar input[type=text]{flex:1;background:#0e0e12;color:var(--txt);border:1px solid var(--line);border-radius:7px;padding:6px 10px;font:inherit}
.bar label{display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
</style>
</head>
<body>
<header>
  <a href="/">←</a>
  <h1>Live logs</h1>
  <span class="status"><span class="dot" id="dot"></span><span id="state">connecting…</span></span>
  <span class="spacer"></span>
  <button id="clear">Clear</button>
  <button id="pause">Pause</button>
</header>
<div id="log"></div>
<div class="bar">
  <input type="text" id="filter" placeholder="filter (substring)" autocomplete="off">
  <label><input type="checkbox" id="autoscroll" checked> auto-scroll</label>
  <span id="count">0 lines</span>
</div>

<script>
const logEl=document.getElementById('log');
const dot=document.getElementById('dot');
const state=document.getElementById('state');
const filterEl=document.getElementById('filter');
const autoscrollEl=document.getElementById('autoscroll');
const countEl=document.getElementById('count');
const pauseBtn=document.getElementById('pause');
const clearBtn=document.getElementById('clear');

let paused=false,total=0,filter='';
const MAX_LINES=2000;

filterEl.addEventListener('input',()=>{filter=filterEl.value.toLowerCase();[...logEl.children].forEach(el=>{el.style.display=(!filter||el.textContent.toLowerCase().includes(filter))?'':'none'})});
pauseBtn.addEventListener('click',()=>{paused=!paused;pauseBtn.textContent=paused?'Resume':'Pause'});
clearBtn.addEventListener('click',()=>{logEl.innerHTML='';total=0;countEl.textContent='0 lines'});

// Strip ANSI color escapes; classify level by ESP-IDF prefix tag.
function ansi(s){return s.replace(/\x1b\[[0-9;]*m/g,'')}
function levelClass(line){
  const m=line.match(/^[IWEDV] \(/);
  if(!m)return '';
  const c=m[0][0];
  return c==='I'?'l-i':c==='W'?'l-w':c==='E'?'l-e':c==='D'?'l-d':c==='V'?'l-v':'';
}

let pending='';
function addLine(line){
  const div=document.createElement('div');
  const cls=levelClass(line);
  if(cls)div.className=cls;
  div.textContent=line;
  if(filter&&!line.toLowerCase().includes(filter))div.style.display='none';
  logEl.appendChild(div);
  total++;
  while(logEl.childNodes.length>MAX_LINES)logEl.removeChild(logEl.firstChild);
}
function feed(text){
  if(paused)return;
  pending+=ansi(text);
  let i;
  while((i=pending.indexOf('\n'))!==-1){
    const line=pending.slice(0,i);
    pending=pending.slice(i+1);
    if(line.length)addLine(line);
  }
  countEl.textContent=total+' lines';
  if(autoscrollEl.checked)logEl.scrollTop=logEl.scrollHeight;
}

let ws,reconnectDelay=500;
function connect(){
  const url=(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/logs';
  ws=new WebSocket(url);
  ws.onopen=()=>{state.textContent='connected';dot.classList.add('on');reconnectDelay=500};
  ws.onmessage=e=>feed(typeof e.data==='string'?e.data:'');
  ws.onclose=()=>{state.textContent='disconnected — retrying…';dot.classList.remove('on');setTimeout(connect,reconnectDelay);reconnectDelay=Math.min(reconnectDelay*2,8000)};
  ws.onerror=()=>{ws.close()};
}
connect();
</script>
</body>
</html>
